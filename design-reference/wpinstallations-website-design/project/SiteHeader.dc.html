<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Manrope:wght@400..800&display=swap" rel="stylesheet"><style>body{margin:0}</style></helmet>
<div style="position:sticky;top:0;z-index:50;background:rgba(255,255,255,.94);backdrop-filter:blur(10px);border-bottom:1px solid #E3E8F0;font-family:Manrope,system-ui,sans-serif">
  <div style="max-width:1160px;margin:0 auto;padding:0 24px;height:72px;display:flex;align-items:center;gap:28px">
    <a href="Home.dc.html" style="display:flex;align-items:center;gap:10px;text-decoration:none;color:#0F1B33;flex:none">
      <span style="width:34px;height:34px;border-radius:9px;background:#0B3D91;display:grid;place-items:center;color:#fff;font-family:'Bricolage Grotesque',system-ui,sans-serif;font-weight:800;font-size:18px;letter-spacing:-.5px">W</span>
      <span style="font-family:'Bricolage Grotesque',system-ui,sans-serif;font-weight:700;font-size:19px;letter-spacing:-.3px">WPInstallations</span>
    </a>
    <sc-if value="{{ desktop }}" hint-placeholder-val="{{ true }}">
      <nav style="display:flex;gap:26px;align-items:center;margin-left:auto">
        <div style="position:relative;padding:22px 0" onMouseEnter="{{ openServices }}" onMouseLeave="{{ closeServices }}">
          <button type="button" onClick="{{ toggleServices }}" style="display:flex;align-items:center;gap:6px;background:none;border:0;cursor:pointer;font:inherit;font-weight:600;font-size:15px;color:#0F1B33;padding:0">Services <svg width="12" height="12" viewBox="0 0 12 12" fill="none"><path d="M2 4l4 4 4-4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg></button>
          <sc-if value="{{ servicesOpen }}" hint-placeholder-val="{{ false }}">
            <div style="position:absolute;top:64px;left:-16px;width:320px;background:#fff;border:1px solid #E3E8F0;border-radius:14px;box-shadow:0 16px 40px rgba(15,27,51,.12);padding:8px">
              <sc-for list="{{ services }}" as="s" hint-placeholder-count="3">
                <a href="Service.dc.html?service={{ s.slug }}" style="display:block;padding:12px 14px;border-radius:10px;text-decoration:none;color:#0F1B33" style-hover="background:#EEF3FB">
                  <span style="display:block;font-weight:700;font-size:15px">{{ s.name }}</span>
                  <span style="display:block;font-size:13px;color:#5B6475;margin-top:2px">{{ s.short }}</span>
                </a>
              </sc-for>
              <a href="Services.dc.html" style="display:block;margin:6px 8px 4px;padding:10px 14px;border-top:1px solid #E3E8F0;font-size:14px;font-weight:700;color:#0B3D91;text-decoration:none">All services →</a>
            </div>
          </sc-if>
        </div>
        <a href="About.dc.html" style="font-weight:600;font-size:15px;color:#0F1B33;text-decoration:none" style-hover="color:#0B3D91">About</a>
        <a href="#blog" style="font-weight:600;font-size:15px;color:#0F1B33;text-decoration:none" style-hover="color:#0B3D91">Blog</a>
        <a href="Contact.dc.html" style="font-weight:600;font-size:15px;color:#0F1B33;text-decoration:none" style-hover="color:#0B3D91">Contact</a>
      </nav>
      <a href="tel:+12145550148" style="font-weight:700;font-size:15px;color:#0F1B33;text-decoration:none;white-space:nowrap">(214) 555-0148</a>
      <a href="Contact.dc.html" style="display:inline-flex;align-items:center;background:#0B3D91;color:#fff;font-weight:700;font-size:15px;padding:11px 18px;border-radius:10px;text-decoration:none;white-space:nowrap" style-hover="background:#072B68">Get a free site audit</a>
    </sc-if>
    <sc-if value="{{ mobile }}" hint-placeholder-val="{{ false }}">
      <button type="button" onClick="{{ toggleMenu }}" aria-label="Menu" style="margin-left:auto;width:44px;height:44px;border:1px solid #E3E8F0;border-radius:10px;background:#fff;display:grid;place-items:center;cursor:pointer;color:#0F1B33"><svg width="20" height="20" viewBox="0 0 20 20" fill="none"><path d="M3 5h14M3 10h14M3 15h14" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg></button>
    </sc-if>
  </div>
  <sc-if value="{{ menuOpen }}" hint-placeholder-val="{{ false }}">
    <div style="border-top:1px solid #E3E8F0;background:#fff;padding:12px 24px 24px;display:flex;flex-direction:column;gap:4px">
      <span style="font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#5B6475;padding:12px 0 6px">Services</span>
      <sc-for list="{{ services }}" as="s" hint-placeholder-count="3">
        <a href="Service.dc.html?service={{ s.slug }}" style="display:block;padding:12px 0;font-weight:700;font-size:17px;color:#0F1B33;text-decoration:none;border-bottom:1px solid #F1F4F9">{{ s.name }}</a>
      </sc-for>
      <a href="Services.dc.html" style="display:block;padding:12px 0;font-weight:700;font-size:17px;color:#0B3D91;text-decoration:none;border-bottom:1px solid #F1F4F9">All services</a>
      <a href="About.dc.html" style="display:block;padding:12px 0;font-weight:700;font-size:17px;color:#0F1B33;text-decoration:none;border-bottom:1px solid #F1F4F9">About</a>
      <a href="#blog" style="display:block;padding:12px 0;font-weight:700;font-size:17px;color:#0F1B33;text-decoration:none;border-bottom:1px solid #F1F4F9">Blog</a>
      <a href="Contact.dc.html" style="display:block;padding:12px 0;font-weight:700;font-size:17px;color:#0F1B33;text-decoration:none">Contact</a>
      <a href="tel:+12145550148" style="display:block;padding:8px 0 16px;font-weight:600;font-size:15px;color:#5B6475;text-decoration:none">(214) 555-0148</a>
      <a href="Contact.dc.html" style="display:flex;justify-content:center;background:#0B3D91;color:#fff;font-weight:700;font-size:16px;padding:14px 18px;border-radius:10px;text-decoration:none">Get a free site audit</a>
    </div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { services: [], servicesOpen: false, menuOpen: false, w: typeof window !== 'undefined' ? window.innerWidth : 1200 };
  componentDidMount() {
    import('./services.js').then(m => this.setState({ services: m.services }));
    this._r = () => this.setState({ w: window.innerWidth });
    window.addEventListener('resize', this._r);
  }
  componentWillUnmount() { window.removeEventListener('resize', this._r); }
  renderVals() {
    const mobile = this.state.w < 900;
    return {
      services: this.state.services,
      desktop: !mobile, mobile,
      servicesOpen: this.state.servicesOpen,
      menuOpen: mobile && this.state.menuOpen,
      openServices: () => this.setState({ servicesOpen: true }),
      closeServices: () => this.setState({ servicesOpen: false }),
      toggleServices: () => this.setState(s => ({ servicesOpen: !s.servicesOpen })),
      toggleMenu: () => this.setState(s => ({ menuOpen: !s.menuOpen }))
    };
  }
}
</script>
</body>
</html>
